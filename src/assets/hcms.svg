<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="HCMS.ai — AI-Powered Human Capital Management">
  <defs>
    <linearGradient id="hcmsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3f"/>
      <stop offset="0.55" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#0089d6"/>
    </linearGradient>
    <linearGradient id="hcmsAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="hcmsGlow" cx="0.8" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#hcmsBg)"/>
  <rect width="600" height="400" fill="url(#hcmsGlow)"/>

  <!-- subtle network / nodes motif -->
  <g stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="70" y1="300" x2="150" y2="250"/>
    <line x1="150" y1="250" x2="230" y2="300"/>
    <line x1="230" y1="300" x2="300" y2="240"/>
    <line x1="470" y1="90" x2="530" y2="140"/>
    <line x1="530" y1="140" x2="500" y2="210"/>
  </g>
  <g fill="#7dd3fc" fill-opacity="0.55">
    <circle cx="70" cy="300" r="5"/>
    <circle cx="150" cy="250" r="5"/>
    <circle cx="230" cy="300" r="5"/>
    <circle cx="300" cy="240" r="5"/>
    <circle cx="470" cy="90" r="5"/>
    <circle cx="530" cy="140" r="5"/>
    <circle cx="500" cy="210" r="5"/>
  </g>

  <text x="60" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">
    HCMS<tspan fill="url(#hcmsAccent)">.ai</tspan>
  </text>
  <rect x="62" y="205" width="120" height="6" rx="3" fill="url(#hcmsAccent)"/>
  <text x="62" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#dbeafe">
    AI-Powered Human Capital Management
  </text>
  <text x="62" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#93c5fd">
    Enterprise platform for the UAE Government
  </text>
</svg>
